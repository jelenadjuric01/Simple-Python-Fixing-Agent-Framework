type: marketplace
title: Building a Python Fixing AI Agent using Lang Frameworks
language: English
summary: |
  <p>The same Python bug-fixing agent, built three times: as a plain loop with no framework, then rebuilt on LangGraph and LangChain, then driven by a model that reasons before it acts.</p> <p>You start by reading a working agent, then write the parts no framework can write for you: where a run is allowed to end, and what to do about a model that has stopped making progress. Along the way you see what a framework actually gives you, what it leaves to you, and what reasoning costs in tokens, latency and context.</p> <p>Every exercise is checked against a scripted fake model, so you can finish the whole course offline. Running your finished agent against a real local model — JetBrains Mellum2 through Ollama — is the reward, not a prerequisite.</p>
